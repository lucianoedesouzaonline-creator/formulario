<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu App de Contato PWA</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .form-container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        h2 {
            margin-bottom: 20px;
            color: #333;
            text-align: center;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }

        input,
        textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        #status-message {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="form-container">
        <h2>Fale Conosco</h2>

        <!-- Formulário controlado por JavaScript (sem sair da página) -->
        <form id="contact-form">
            <label for="email">Seu E-mail:</label>
            <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required />

            <label for="message">Sua Mensagem:</label>
            <textarea id="message" name="message" rows="4" placeholder="Escreva sua mensagem aqui..."
                required></textarea>

            <button type="submit" id="submit-btn">Enviar Mensagem</button>
        </form>

        <div id="status-message"></div>
    </div>

    <script>
        const form = document.getElementById('contact-form');
        const statusMessage = document.getElementById('status-message');
        const submitBtn = document.getElementById('submit-btn');

        form.addEventListener('submit', async function (e) {
            e.preventDefault(); // Evita o comportamento padrão de recarregar/mudar de página

            submitBtn.disabled = true;
            submitBtn.innerText = 'Enviando...';
            statusMessage.innerText = '';

            const formData = new FormData(form);

            try {
                const response = alt = await fetch('https://formspree.io/f/mdegogqy', {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'Accept': 'application/json'
                    }
                });

                if (response.ok) {
                    statusMessage.style.color = 'green';
                    statusMessage.innerText = 'Mensagem enviada com sucesso!';
                    form.reset(); // Limpa os campos para o formulário ficar zerado e pronto novamente
                } else {
                    statusMessage.style.color = 'red';
                    statusMessage.innerText = 'Ocorreu um erro ao enviar. Tente novamente.';
                }
            } catch (error) {
                statusMessage.style.color = 'red';
                statusMessage.innerText = 'Erro de conexão. Verifique sua internet.';
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = 'Enviar Mensagem';
            }
        });

        // Registro do Service Worker para manter o app funcionando como PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(() => console.log("Service Worker registrado com sucesso!"))
                .catch((err) => console.log("Erro ao registrar Service Worker:", err));
        }
    </script>
</body>

</html>
