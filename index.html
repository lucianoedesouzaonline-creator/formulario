<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu PWA com Formulário de Contato</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .form-container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        h2 {
            margin-bottom: 20px;
            color: #333;
            text-align: center;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }

        input,
        textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>

    <div class="form-container">
        <h2>Fale Conosco</h2>

        <!-- Formulário integrado ao seu endpoint do Formspree -->
        <form action="https://formspree.io/f/mdegogqy" method="POST">
            <label for="email">Seu E-mail:</label>
            <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required />

            <label for="message">Sua Mensagem:</label>
            <textarea id="message" name="message" rows="4" placeholder="Escreva sua mensagem aqui..."
                required></textarea>

            <button type="submit">Enviar Mensagem</button>
        </form>
    </div>

    <script>
        // Registro do Service Worker para manter a estrutura de PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(() => console.log("Service Worker registrado com sucesso!"))
                .catch((err) => console.log("Erro ao registrar Service Worker:", err));
        }
    </script>
</body>

</html>
