<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App de Contato com Câmera</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .form-container {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        h2 {
            margin-bottom: 20px;
            color: #333;
            text-align: center;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #555;
            font-size: 14px;
        }

        input,
        textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        .camera-box {
            margin-bottom: 15px;
            text-align: center;
        }

        video {
            width: 100%;
            max-height: 200px;
            background: #000;
            border-radius: 6px;
            object-fit: cover;
            margin-bottom: 8px;
        }

        canvas {
            display: none;
        }

        #photo-preview {
            max-width: 100%;
            max-height: 150px;
            border-radius: 6px;
            margin-top: 8px;
            display: none;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 5px;
        }

        button:hover {
            background-color: #0056b3;
        }

        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        .btn-secondary {
            background-color: #28a745;
        }

        .btn-secondary:hover {
            background-color: #218838;
        }

        #status-message {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="form-container">
        <h2>App com Câmera e E-mail</h2>

        <form id="contact-form">
            <label for="email">Seu E-mail:</label>
            <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required />

            <label for="message">Sua Mensagem:</label>
            <textarea id="message" name="message" rows="3" placeholder="Escreva sua mensagem..." required></textarea>

            <label>Foto da Câmera Frontal:</label>
            <div class="camera-box">
                <button type="button" id="start-camera" class="btn-secondary">Ligar Câmera Frontal</button>
                <video id="video" autoplay playsinline style="display:none;"></video>
                <button type="button" id="capture-btn" style="display:none;" class="btn-secondary">Tirar Foto</button>
                <canvas id="canvas"></canvas>
                <img id="photo-preview" alt="Pré-visualização" />
            </div>

            <button type="submit" id="submit-btn">Enviar para o Gmail</button>
        </form>

        <div id="status-message"></div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const photoPreview = document.getElementById('photo-preview');
        const startCameraBtn = document.getElementById('start-camera');
        const captureBtn = document.getElementById('capture-btn');
        const form = document.getElementById('contact-form');
        const statusMessage = document.getElementById('status-message');
        const submitBtn = document.getElementById('submit-btn');

        let photoBlob = null;

        // Ativar a câmera frontal do celular
        startCameraBtn.addEventListener('click', async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user' }, // 'user' seleciona a câmera frontal
                    audio: false
                });
                video.srcObject = stream;
                video.style.display = 'block';
                startCameraBtn.style.display = 'none';
                captureBtn.style.display = 'block';
            } catch (err) {
                alert('Erro ao acessar a câmera. Verifique se permitiu o acesso nas configurações do navegador.');
                console.error(err);
            }
        });

        // Capturar a foto exibida no vídeo
        captureBtn.addEventListener('click', () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const context = canvas.getContext('2d');
            context.drawImage(video, 0, 0, canvas.width, canvas.height);

            // Converter a imagem capturada em um arquivo Blob
            canvas.toBlob((blob) => {
                photoBlob = blob;
                const imageUrl = URL.createObjectURL(blob);
                photoPreview.src = imageUrl;
                photoPreview.style.display = 'block';

                // Desligar a câmera após a foto tirada
                const stream = video.srcObject;
                if (stream) {
                    stream.getTracks().forEach(track => track.stop());
                }
                video.style.display = 'none';
                captureBtn.style.display = 'none';
                startCameraBtn.style.display = 'block';
                startCameraBtn.innerText = 'Tirar Outra Foto';
            }, 'image/jpeg', 0.8);
        });

        // Enviar dados e a foto capturada via Fetch para o Formspree
        form.addEventListener('submit', async function (e) {
            e.preventDefault();

            submitBtn.disabled = true;
            submitBtn.innerText = 'Enviando dados e foto...';
            statusMessage.innerText = '';

            const formData = new FormData(form);

            // Adiciona a foto capturada ao pacote de envio se ela existir
            if (photoBlob) {
                formData.append('upload_file', photoBlob, 'foto-frontal.jpg');
            }

            try {
                const response = await fetch('https://formspree.io/f/mdegogqy', {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'Accept': 'application/json'
                    }
                });

                if (response.ok) {
                    statusMessage.style.color = 'green';
                    statusMessage.innerText = 'Mensagem e foto enviadas com sucesso!';
                    form.reset();
                    photoPreview.style.display = 'none';
                    photoBlob = null;
                    startCameraBtn.innerText = 'Ligar Câmera Frontal';
                } else {
                    statusMessage.style.color = 'red';
                    statusMessage.innerText = 'Ocorreu um erro ao enviar. Tente novamente.';
                }
            } catch (error) {
                statusMessage.style.color = 'red';
                statusMessage.innerText = 'Erro de conexão.';
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = 'Enviar para o Gmail';
            }
        });

        // Registro do Service Worker para manter o PWA funcionando
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(() => console.log("Service Worker registrado com sucesso!"))
                .catch((err) => console.log("Erro ao registrar Service Worker:", err));
        }
    </script>
</body>

</html>
