<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bússola & Painel Náutico</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0b132b;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
        }

        header {
            text-align: center;
        }

        h2 {
            margin: 0;
            font-size: 20px;
            color: #4cc9f0;
            letter-spacing: 1px;
        }

        .bussola-container {
            position: relative;
            width: 220px;
            height: 220px;
            border: 6px solid #4cc9f0;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(28, 37, 65, 0.8);
            box-shadow: 0 0 25px rgba(76, 201, 240, 0.3);
            margin: 10px 0;
        }

        #graus {
            font-size: 42px;
            font-weight: bold;
            color: #ffcc00;
        }

        .card-info {
            background-color: #1c2541;
            width: 100%;
            max-width: 340px;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 10px;
            border-left: 5px solid #4cc9f0;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            font-size: 15px;
            border-bottom: 1px solid #3a4a7f;
            padding-bottom: 5px;
        }

        .info-row:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .info-label {
            color: #90e0ef;
            font-weight: bold;
        }

        .info-value {
            font-family: monospace;
            font-size: 16px;
            text-align: right;
        }

        .btn-permissao {
            width: 100%;
            max-width: 340px;
            padding: 15px;
            background-color: #4cc9f0;
            color: #0b132b;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-permissao:active {
            background-color: #3a86ff;
            color: #fff;
        }

        /* Pequena alteração para acomodar as duas velocidades */
        #velocidade {
            font-size: 14px;
            /* Fonte um pouco menor para caber as duas linhas */
            line-height: 1.4;
        }
    </style>
</head>

<body>

    <header>
        <h2>PAINEL NÁUTICO PWA</h2>
    </header>

    <!-- Visor da Bússola -->
    <div class="bussola-container">
        <div id="graus">--°</div>
    </div>

    <!-- Bloco de Dados do GPS e Sensores -->
    <div class="card-info">
        <div class="info-row">
            <span class="info-label">Direção:</span>
            <span id="direcao-card" class="info-value">Aguardando...</span>
        </div>
        <div class="info-row">
            <span class="info-label">Velocidade:</span>
            <span id="velocidade" class="info-value">0.0 nós<br>0.0 km/h</span>
        </div>
        <div class="info-row">
            <span class="info-label">Latitude:</span>
            <span id="lat" class="info-value">--</span>
        </div>
        <div class="info-row">
            <span class="info-label">Longitude:</span>
            <span id="lon" class="info-value">--</span>
        </div>
    </div>

    <!-- Botão de ativação de sensores (Exigido por alguns navegadores móveis) -->
    <button id="btn-ativar" class="btn-permissao">ATIVAR SENSORES & GPS</button>

    <script>
        const grausText = document.getElementById('graus');
        const direcaoCard = document.getElementById('direcao-card');
        const velocidadeText = document.getElementById('velocidade');
        const latText = document.getElementById('lat');
        const lonText = document.getElementById('lon');
        const btnAtivar = document.getElementById('btn-ativar');

        // Função para converter graus em pontos cardeais
        function obterPontoCardinal(graus) {
            const direcoes = ["Norte", "Nordeste", "Leste", "Sudeste", "Sul", "Sudoeste", "Oeste", "Noroeste"];
            const index = Math.round((graus % 360) / 45);
            return direcoes[index % 8];
        }

        // Ativar sensores e geolocalização ao tocar no botão
        btnAtivar.addEventListener('click', () => {
            btnAtivar.innerText = 'Ativando...';

            // 1. Permissão para Bússola / Orientação
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(response => {
                        if (response === 'granted') {
                            iniciarBussola();
                        } else {
                            alert('Permissão de orientação negada pelo navegador.');
                            direcaoCard.innerText = "Sem permissão";
                        }
                    }).catch(console.error);
            } else {
                // Androids geralmente não precisam de requestPermission explícito, apenas HTTPS
                iniciarBussola();
            }

            // 2. Ativar GPS (Geolocalização em tempo real)
            if ('geolocation' in navigator) {
                navigator.geolocation.watchPosition((position) => {
                    const latitude = position.coords.latitude.toFixed(5);
                    const longitude = position.coords.longitude.toFixed(5);

                    latText.innerText = latitude;
                    lonText.innerText = longitude;

                    // GPS fornece velocidade em metros por segundo (m/s)
                    const speed_ms = position.coords.speed;

                    if (speed_ms !== null && speed_ms > 0) {
                        // Converter m/s para Nós (m/s * 1.94384)
                        const nos = (speed_ms * 1.94384).toFixed(1);
                        // Converter m/s para Km/h (m/s * 3.6)
                        const kmh = (speed_ms * 3.6).toFixed(1);

                        velocidadeText.innerHTML = `${nos} nós<br>${kmh} km/h`;
                    } else {
                        velocidadeText.innerHTML = "0.0 nós<br>0.0 km/h";
                    }
                }, (error) => {
                    console.error(error);
                    if (error.code === error.PERMISSION_DENIED) {
                        alert("Você negou o acesso ao GPS. O painel de velocidade e coordenadas não funcionará.");
                        latText.innerText = "GPS Negado";
                    } else {
                        latText.innerText = "Erro no GPS";
                    }
                }, {
                    enableHighAccuracy: true, // Força o uso do GPS de alta precisão (consome mais bateria)
                    maximumAge: 1000,         // Tenta pegar posição nova a cada segundo
                    timeout: 5000             // Dá 5 segundos para achar o satélite
                });
            } else {
                alert('Geolocalização não suportada neste aparelho.');
            }

            btnAtivar.style.display = 'none'; // Esconde o botão após ativar
            document.querySelector('.card-info').style.display = 'flex'; // Garante que o card apareça
        });

        // Ouvinte da Bússola
        function iniciarBussola() {
            // Verifica se o navegador suporta a API de orientação
            if ('ondeviceorientationabsolute' in window) {
                window.addEventListener('deviceorientationabsolute', tratarOrientacao, true);
            } else if ('ondeviceorientation' in window) {
                window.addEventListener('deviceorientation', tratarOrientacao, true);
            } else {
                direcaoCard.innerText = "Sensor não suportado";
            }
        }

        function tratarOrientacao(event) {
            let compass = event.webkitCompassHeading || event.alpha;

            if (compass !== null && compass !== undefined) {
                // Ajusta para compasso de 0 a 360 graus (usando math.abs para garantir que não dê negativo)
                let angulo = Math.round(360 - compass);
                if (angulo >= 360) angulo = 0;
                if (angulo < 0) angulo = Math.abs(angulo);

                grausText.innerText = `${angulo}°`;
                direcaoCard.innerText = obterPontoCardinal(angulo);
            } else {
                direcaoCard.innerText = "Calibrando...";
            }
        }

        // Registro do Service Worker para PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(() => console.log("SW registrado"))
                .catch((err) => console.log("Erro SW:", err));
        }
    </script>
</body>

</html>
